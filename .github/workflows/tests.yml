name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A PR that gets pushed to twice shouldn't pay for the superseded simulator run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two venues run as separate jobs so the fast one reports in ~a minute
  # instead of waiting behind a tvOS simulator boot. All three use `xcode-27`:
  # GitHub names macOS images by Xcode major version, so the label carries the
  # same Xcode developers run locally, plus the "Apple TV 4K (3rd generation)"
  # simulator that SIM_DEST in the Makefile expects.
  host:
    name: JellyfinKit (host)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode version
        run: xcodebuild -version

      - name: Test
        run: make test-host

  simulator:
    name: App + DesignSystem + Features (tvOS simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode version
        run: xcodebuild -version

      # Same command developers run locally, so a green CI run and a green local
      # run mean the same thing.
      - name: Test
        run: make test-sim

  # The app ships to tvOS and visionOS. The simulator job above covers the tvOS
  # build on its way to running the tests; nothing covered visionOS, so a break
  # there stayed invisible until someone built for Vision Pro by hand — which
  # has happened. Build only: the test targets are wired into the "Jelly Shark"
  # scheme and run on tvOS, and what they cover is platform-agnostic, so
  # compiling is where the value is.
  visionos:
    name: App (visionOS build)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: make build-visionos
